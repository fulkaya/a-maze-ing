[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
authors = [{ name = "fulkaya" },
		   { name = "mkangal" }]
description = "Maze generator module"
readme = "mazegen/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]

[tool.setuptools.packages.find]
include = ["mazegen*"]